version: 2

updates:
  # NPM dependencies (root) - security updates only
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "security"
      include: "scope"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # NPM dependencies (js-sdk) - security updates only
  - package-ecosystem: "npm"
    directory: "/packages/js-sdk"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "security"
      include: "scope"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # Go dependencies (go-sdk) - security updates only
  - package-ecosystem: "gomod"
    directory: "/packages/go-sdk"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "security"
      include: "scope"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # Maven dependencies (java-sdk) - security updates only
