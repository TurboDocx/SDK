      - dependency-type: "all"
    rebase-strategy: "auto"

  # Composer dependencies (php-sdk) - security updates only
  - package-ecosystem: "composer"
    directory: "/packages/php-sdk"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "security"
      include: "scope"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # Pip dependencies (py-sdk) - security updates only
  - package-ecosystem: "pip"
    directory: "/packages/py-sdk"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "security"
      include: "scope"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # Bundler dependencies (ruby-sdk) - security updates only
  - package-ecosystem: "bundler"
    directory: "/packages/ruby-sdk"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "security"
      include: "scope"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"

  # GitHub Actions dependencies - security updates only
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "security"
      include: "scope"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"
