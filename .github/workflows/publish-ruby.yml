name: Publish Ruby SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.4.0)'
        required: true
        type: string

jobs:
  publish:
    name: Publish to RubyGems
    # Only publish on a ruby-sdk-v* release (or a manual dispatch) — same guard
    # as the other publish workflows so a multi-SDK release cut doesn't fire
    # every registry at once.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ruby-sdk-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ruby-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: packages/ruby-sdk

      - name: Run tests
        run: bundle exec rspec

      - name: Build gem
        run: gem build turbodocx-sdk.gemspec

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push turbodocx-sdk-*.gem
