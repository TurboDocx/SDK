name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-js:
    name: Test JavaScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js-sdk
    strategy:
      matrix:
        # 18 is the declared engines floor (package.json); 22 is the current LTS.
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  lint-js:
    name: Lint JavaScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Oxlint needs Node 20.19 or later; the SDK itself still supports 18 (see test-js).
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Fails on any violation the baseline counts do not cover and, on a pull request, on counts
        # that grew compared to the base branch. A PR that turns on a new rule and baselines its
        # violations opts in with the lint-baseline-growth label.
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_BASELINE_GROWTH: ${{ contains(github.event.pull_request.labels.*.name, 'lint-baseline-growth') }}
        run: |
          base_args=""
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base_args="--base FETCH_HEAD"
          fi
          if [ "$ALLOW_BASELINE_GROWTH" = "true" ]; then base_args="$base_args --allow-base-growth"; fi
          npm run -s lint:ci -- $base_args

  test-embed:
    name: Test Embed Widget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/embed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  test-py:
    name: Test Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/py-sdk
    strategy:
      matrix:
        # 3.9 is the declared floor; 3.10 is what requirements-lock.txt is resolved for.
        python-version: ['3.9', '3.10']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  test-go:
    name: Test Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod tidy

      - name: Run tests
        run: go test -v ./...

  test-php:
    name: Test PHP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/php-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: json, fileinfo, dom, xml, mbstring, curl
          coverage: none

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

      - name: Run PHPStan
        run: composer phpstan

      - name: Check code style
        run: composer cs-fix -- --dry-run --diff

  test-java:
    name: Test Java SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by the dependency-submission step below
    defaults:
      run:
        working-directory: packages/java-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test -B

      # A bare pom.xml gives the dependency graph direct deps only, so okhttp's
      # transitives (okio, kotlin-stdlib) are invisible to Dependabot. This
      # submits the resolved tree. Push-to-default-branch only: the submission
      # API writes to the repo's graph and needs a token PRs don't get.
      - name: Submit Maven dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/maven-dependency-submission-action@v5
        with:
          directory: packages/java-sdk

  test-ruby:
    name: Test Ruby SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ruby-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: packages/ruby-sdk

      - name: Run tests
        run: bundle exec rspec
