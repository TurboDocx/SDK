name: Publish Java SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    name: Publish to Maven Central
    # Only publish on a java-sdk-v* release (or a manual dispatch). Without this
    # guard the job runs on EVERY release event, so cutting js/py/go/php/ruby
    # releases together fires concurrent Maven deployments of the same
    # com.turbodocx:turbodocx-sdk coordinate, which collide ("currently being
    # published in another deployment"). The other publish workflows already
    # filter this way.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'java-sdk-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/java-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # The runner's Maven moved to 3.10, which adds local-repository metadata to the
      # Central upload bundle, and Central rejects it ("Bundle has content that does NOT
      # have a .pom file"). Pin Maven 3.9.16, checksum-verified, until the publishing
      # plugin handles 3.10.
      - name: Install pinned Maven 3.9.16
        working-directory: ${{ runner.temp }}
        env:
          MAVEN_VERSION: 3.9.16
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          curl -fsSLO "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  apache-maven-${MAVEN_VERSION}-bin.tar.gz" | sha512sum -c -
          tar -xzf "apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin/mvn" -v

      - name: Update version (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mvn versions:set -DnewVersion=${{ inputs.version }}
          mvn versions:commit

      - name: Build and Test
        run: mvn clean verify -B -Dgpg.passphrase=${{ secrets.MAVEN_GPG_PASSPHRASE }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: mvn deploy -B -DskipTests -Dgpg.passphrase=${{ secrets.MAVEN_GPG_PASSPHRASE }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
