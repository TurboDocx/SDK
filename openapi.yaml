components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: TurboDocx API key (or OAuth access token) sent as a Bearer token.
    orgId:
      type: apiKey
      in: header
      name: x-rapiddocx-org-id
      description: Organization ID. Required on all non-partner operations.
    partnerAuth:
      type: http
      scheme: bearer
      description: Partner API key (prefixed `TDXP-`) sent as a Bearer token. Used by TurboPartner operations
        instead of an org-scoped API key.
  schemas:
    GenericRequest:
      type: object
      additionalProperties: true
      description: Request body. See the concrete type in `@turbodocx/sdk` for this operation.
    GenericResponse:
      type: object
      additionalProperties: true
      description: Response body. TurboDocx wraps most payloads in `{ data | result | results }`.
    Error:
      type: object
      description: Error envelope. The SDK reads the reason from `message`, `error`, nested `error.message`,
        or per-field `errors[].message`; the code from `code`, `type`, or nested `error.code`.
      properties:
        message:
          type: string
        code:
          type: string
        type:
          type: string
        error:
          description: String message or `{ message, code }` object.
          oneOf:
          - type: string
          - type: object
            properties:
              message:
                type: string
              code:
                type: string
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
  responses:
    BadRequest:
      description: Validation error (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key (401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not permitted (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict, e.g. resource already exists (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited (429).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
