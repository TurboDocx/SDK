openapi: 3.0.3
info:
  title: TurboDocx API
  version: 0.8.0
  description: 'OpenAPI description of the TurboDocx HTTP API, generated from the `@turbodocx/sdk` TypeScript
    SDK (v0.8.0, `main`). Covers Deliverable (document generation), TurboSign (e-signatures), TurboQuote
    (quotes/CPQ), TurboPartner (partner org management) and TurboWebhooks (signature webhook management).


    Authentication: every request sends `Authorization: Bearer <API key>`. All operations except TurboPartner
    also require the `x-rapiddocx-org-id` header. TurboPartner operations authenticate with a partner
    API key (prefixed `TDXP-`) and carry no org header.


    Scope: this describes the API surface the TurboDocx SDKs call, not the entire backend API. Request/response
    bodies and list-endpoint query parameters (pagination and filters) are intentionally generic here
    - the SDK is the source of the concrete shapes; this spec pins the endpoints, path params, content
    types and auth. See per-type definitions in `@turbodocx/sdk`.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: '{baseUrl}'
  description: TurboDocx API. Defaults to production; override for staging or self-host.
  variables:
    baseUrl:
      default: https://api.turbodocx.com
      description: Base URL. Matches the SDK's `baseUrl` / `TURBODOCX_BASE_URL`.
security:
- bearerAuth: []
  orgId: []
tags:
- name: Deliverable
  description: Template-based document generation.
- name: TurboSign
  description: Digital signatures.
- name: TurboQuote
  description: Quotes, products, price books, bundles, companies, contacts.
- name: TurboPartner
  description: Partner-managed organizations, users and API keys. Authenticates with a partner API key;
    no org header.
- name: TurboWebhooks
  description: Signature webhook subscription management.
